      const [showSpotifyDrawer, setShowSpotifyDrawer] = useState(false);
      const [epkCopied, setEpkCopied] = useState(false);
      const [navScrolled, setNavScrolled] = useState(false);

      const audioRef = useRef(null);
      const candidateIndexRef = useRef(0);

      // Scroll listener
      useEffect(() => {
        const handleScroll = () => {
          setNavScrolled(window.scrollY > 50);
        };
        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);



      // Format time helper MM:SS
      const formatTime = (secs) => {
        if (isNaN(secs) || secs < 0) return "0:00";
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
      };

      // Resilient Candidate Audio Path Generator
      const getCandidatePaths = (track) => {
        const baseName = track.id;
        const noDashName = track.id.replace(/-/g, '');
        return [
          `assets/audio/${baseName}.mp3`,
          `assets/audio/${baseName}.mp3.mp3`,
          `assets/audio/${noDashName}.mp3`,
          `assets/audio/${noDashName}.mp3.mp3`
        ];
      };

      // Load & Play with multiple candidate paths fallback
      const executePlayTrack = (track, shouldAutoplay = true) => {
        const audio = audioRef.current;
        if (!audio) return;

        const candidates = getCandidatePaths(track);
        candidateIndexRef.current = 0;

        const tryCandidate = (index) => {
          if (index >= candidates.length) {
            console.warn("Semua variasi nama file audio tidak ditemukan, fallback ke Spotify drawer.");
            setIsPlaying(false);
            setShowSpotifyDrawer(true);
            return;
          }

          const targetPath = candidates[index];
          audio.src = targetPath;
          audio.load();

          if (shouldAutoplay) {
            const playPromise = audio.play();
            if (playPromise !== undefined) {
              playPromise
                .then(() => {
                  setIsPlaying(true);
                })
                .catch(err => {
                  console.log("Candidate failed (" + targetPath + "), mencoba variasi berikutnya:", err);
                  tryCandidate(index + 1);
                });
            }
          }
        };

        tryCandidate(0);
      };

      // Initialize audio on mount
      useEffect(() => {
        executePlayTrack(SINGLES_DATA[0], false);
      }, []);

      // 1. PRIMARY PLAY / PAUSE TOGGLE
      const togglePlayPause = () => {
        const audio = audioRef.current;
        if (!audio) return;

        if (isPlaying) {
          audio.pause();
          setIsPlaying(false);
        } else {
          setIsPlaying(true);
          if (!audio.src || audio.src.endsWith('/') || audio.networkState === 3) {
            executePlayTrack(currentTrack, true);
          } else {
            const playPromise = audio.play();
            if (playPromise !== undefined) {
              playPromise
                .then(() => setIsPlaying(true))
                .catch((err) => {
                  console.warn("Direct play failed, trying fallback:", err);
                  executePlayTrack(currentTrack, true);
                });
            }
          }
        }
      };

      // 2. NEXT TRACK
      const playNextTrack = () => {
        const curIndex = SINGLES_DATA.findIndex(s => s.id === currentTrack.id);
        const nextIndex = (curIndex + 1) % SINGLES_DATA.length;
        const nextTrack = SINGLES_DATA[nextIndex];
        setCurrentTrack(nextTrack);
        setIsPlaying(true);
        executePlayTrack(nextTrack, true);
      };

      // 3. PREVIOUS TRACK
      const playPrevTrack = () => {
        const audio = audioRef.current;
        if (audio && audio.currentTime > 3) {
          audio.currentTime = 0;
          setCurrentTime(0);
          return;
        }
        const curIndex = SINGLES_DATA.findIndex(s => s.id === currentTrack.id);
        const prevIndex = (curIndex - 1 + SINGLES_DATA.length) % SINGLES_DATA.length;
        const prevTrack = SINGLES_DATA[prevIndex];
        setCurrentTrack(prevTrack);
        setIsPlaying(true);
        executePlayTrack(prevTrack, true);
      };

      // 4. PLAY SPECIFIC TRACK
      const playSpecificTrack = (track) => {
        if (currentTrack.id === track.id) {
          togglePlayPause();
        } else {
          setCurrentTrack(track);
          setIsPlaying(true);
          executePlayTrack(track, true);
        }
      };

      // 5. MUTE / UNMUTE
      const toggleMute = () => {
        const audio = audioRef.current;
        if (!audio) return;
        const nextState = !isMuted;
        audio.muted = nextState;
        setIsMuted(nextState);
      };

      // 6. VOLUME SLIDER
      const handleVolumeChange = (e) => {
        const newVol = parseFloat(e.target.value);
        setVolume(newVol);
        if (audioRef.current) {
          audioRef.current.volume = newVol;
          if (newVol > 0 && isMuted) {
            audioRef.current.muted = false;
            setIsMuted(false);
          }
        }
      };

      // 7. SEEKBAR / SCRUBBER
      const handleScrubberChange = (e) => {
        const val = parseFloat(e.target.value);
        setDragTime(val);
      };

      const handleScrubberMouseDown = () => {
        setIsDragging(true);
      };

      const handleScrubberMouseUp = (e) => {
        const val = parseFloat(e.target.value);
        setIsDragging(false);
        if (audioRef.current) {
          audioRef.current.currentTime = val;
          setCurrentTime(val);
        }
      };

      const handleAudioTimeUpdate = () => {
        if (!isDragging && audioRef.current) {
          setCurrentTime(audioRef.current.currentTime);
          setDuration(audioRef.current.duration || 0);
        }
      };

      const handleLoadedMetadata = () => {
        if (audioRef.current) {
          setDuration(audioRef.current.duration || 0);

      };

Origin: Indonesia

          setTimeout(() => setEpkCopied(false), 3000);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(epkSummary)
            .then(markCopied)
            .catch(() => {
              const ta = document.createElement("textarea");
              ta.value = epkSummary;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              document.body.removeChild(ta);
              markCopied();
            });
        } else {
          const ta = document.createElement("textarea");
          ta.value = epkSummary;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          markCopied();
        }
      };

                  <button
                    onClick={togglePlayPause}
                    className="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-white text-black flex items-center justify-center shadow-lg shadow-white/20 hover:scale-105 active:scale-95 transition-all duration-150 cursor-pointer group"
                    title={isPlaying ? "Pause / Jeda" : "Play / Putar"}
                  >
                    {isPlaying ? (
                      <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6 sm:w-7 sm:h-7 text-black transition-transform group-active:scale-90">
                        <rect x="6" y="4" width="4" height="16" rx="1.5" />
                        <rect x="14" y="4" width="4" height="16" rx="1.5" />
                      </svg>
                    ) : (
                      <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6 sm:w-7 sm:h-7 text-black translate-x-[1.5px] transition-transform group-active:scale-90">
                        <polygon points="6 3 20 12 6 21 6 3" />
                      </svg>
                    )}
                  </button>

                  {/* Tombol Maju (Next Song) */}
                  <button
                    onClick={playNextTrack}
                    className="p-2 text-slate-400 hover:text-white hover:bg-white/10 rounded-full transition-all active:scale-90"
                    title="Lagu Berikutnya"
                  >
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5">
                      <polygon points="5 4 15 12 5 20 5 4" />
                      <rect x="16.5" y="4" width="2.5" height="16" rx="0.5" />
                    </svg>
                  </button>

                </div>

                {/* Manual Draggable Scrubber */}
                <div className="w-full flex items-center gap-3 text-[11px] font-mono text-slate-400 select-none">
                  <span className="w-9 text-right">{formatTime(activeTime)}</span>
                  
                  <div className="flex-1 relative flex items-center">
                    <input 
                      type="range"
                      min="0"
                      max={duration > 0 ? duration : 100}
                      step="0.1"
                      value={activeTime}
                      onChange={handleScrubberChange}
                      onMouseDown={handleScrubberMouseDown}
                      onMouseUp={handleScrubberMouseUp}
                      onTouchStart={handleScrubberMouseDown}
                      onTouchEnd={handleScrubberMouseUp}
                      className="music-scrubber"
                      title="Geser posisi lagu"
                    />
                  </div>

                  <span className="w-9">{duration > 0 ? formatTime(duration) : currentTrack.duration}</span>
                </div>

              </div>

              {/* Right: Mute Button, Volume Slider & Spotify Drawer Toggle */}
              <div className="flex items-center gap-3 w-full md:w-auto justify-end">
                
                {/* Volume & Mute Controls */}
                <div className="flex items-center gap-2 group">
                  <button 
                    onClick={toggleMute}
                    className={`p-1.5 rounded-full transition-colors ${
                      isMuted ? "text-rose-400 hover:text-rose-300 bg-rose-500/10" : "text-slate-400 hover:text-white"
                    }`}
                    title={isMuted ? "Unmute Audio" : "Mute Audio"}
                  >
                    {isMuted || volume === 0 ? (
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" />
                        <line x1="23" y1="9" x2="17" y2="15" />
                        <line x1="17" y1="9" x2="23" y2="15" />
                      </svg>
                    ) : volume < 0.5 ? (
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                      </svg>
                    ) : (
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" />
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                      </svg>
                    )}
                    </button>

                  {/* Volume Slider */}
                  <input 
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value={isMuted ? 0 : volume}
                    onChange={handleVolumeChange}
                    className="w-16 h-1 bg-white/20 rounded-full accent-purple-400 cursor-pointer hidden sm:block"
                    title={`Volume: ${Math.round((isMuted ? 0 : volume) * 100)}%`}
                  />
                </div>

                {/* Spotify Drawer Toggle */}
                <button
                  onClick={() => setShowSpotifyDrawer(!showSpotifyDrawer)}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium transition-all ${
                    showSpotifyDrawer 
                      ? "bg-emerald-500 text-black font-semibold shadow-lg shadow-emerald-950/50" 
                      : "bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-400 border border-emerald-500/30"
                  }`}
                  title="Buka / Tutup Spotify Player"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3.5 h-3.5">
                    <path d="M9 18V5l12-2v13" />
                    <circle cx="6" cy="18" r="3" />
                    <circle cx="18" cy="16" r="3" />
                  </svg>
                  <span>Spotify</span>
                </button>

              </div>

            </div>
          </div>

          {/* ================= LYRICS MODAL ================= */}
          {selectedLyrics && (
            <div 
              onClick={() => setSelectedLyrics(null)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md cursor-pointer"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="glass-panel max-w-lg w-full rounded-3xl p-6 sm:p-8 max-h-[85vh] overflow-y-auto border border-purple-500/30 relative shadow-2xl cursor-default"
              >
                
                <button
                  onClick={() => setSelectedLyrics(null)}
                  className="absolute top-5 right-5 p-2 rounded-full glass-card hover:bg-white/20 text-slate-400 hover:text-white transition-colors"
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                  </svg>
                </button>

                <div className="flex items-center gap-4 mb-6">
                  <img src={selectedLyrics.cover} alt={selectedLyrics.title} className="w-16 h-16 rounded-xl object-cover border border-white/10" />
                  <div>
                    <span className="text-xs font-mono text-purple-400 uppercase tracking-widest">{selectedLyrics.year} Single</span>
                    <h3 className="font-serif italic font-bold text-3xl text-white">{selectedLyrics.title}</h3>
                  </div>
                </div>

                <div className="whitespace-pre-line font-serif text-slate-300 text-base leading-relaxed p-4 rounded-2xl bg-black/40 border border-white/5">
                  {selectedLyrics.fullLyrics}
                </div>

                <div className="mt-6 flex justify-between items-center text-xs">
                  <button
                    onClick={() => {
                      setCurrentTrack(selectedLyrics);
                      setShowSpotifyDrawer(true);
                      setSelectedLyrics(null);
                    }}
                    className="text-emerald-400 hover:underline flex items-center gap-1"
                  >
                    <span>Dengarkan di Spotify</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3.5 h-3.5">
                      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                      <polyline points="15 3 21 3 21 9" />
                      <line x1="10" y1="14" x2="21" y2="3" />
                    </svg>
                  </button>
                  <button
                    onClick={() => setSelectedLyrics(null)}
                    className="px-4 py-2 rounded-full bg-purple-600 hover:bg-purple-500 text-white font-medium transition-colors"
                  >
                    Tutup
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ================= LIGHTBOX IMAGE MODAL ================= */}
          {lightboxImage && (
            <div 
              onClick={() => setLightboxImage(null)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-lg cursor-pointer"
            >
              <div 
                onClick={(e) => e.stopPropagation()} 
                className="max-w-4xl w-full glass-panel rounded-3xl overflow-hidden border border-white/20 shadow-2xl"
              >
                <div className="relative max-h-[75vh] bg-black flex items-center justify-center">
                  <img src={lightboxImage.src} alt={lightboxImage.title} className="max-h-[75vh] w-auto object-contain" />
                  <button
                    onClick={() => setLightboxImage(null)}
                    className="absolute top-4 right-4 p-2.5 rounded-full bg-black/60 hover:bg-black/90 text-white transition-colors border border-white/10"
                  >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
                      <line x1="18" y1="6" x2="6" y2="18" />
                      <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                  </button>
                </div>
                <div className="p-6 bg-brand-dark flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div>
                    <span className="text-xs font-mono text-purple-400 uppercase tracking-widest">{lightboxImage.tag}</span>
                    <h3 className="font-serif italic font-bold text-2xl text-white">{lightboxImage.title}</h3>
                    <p className="text-xs sm:text-sm text-slate-300 mt-1">{lightboxImage.desc}</p>
                  </div>
                  <a 
                    href={lightboxImage.src} 
                    download 
                    className="px-4 py-2 rounded-full glass-card hover:bg-white/10 text-xs font-mono text-slate-200 shrink-0 flex items-center gap-1.5"
                  >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3.5 h-3.5">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                      <polyline points="7 10 12 15 17 10" />
                      <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    <span>Simpan Foto</span>
                  </a>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ParanoiseApp />);
  </script>
</body>
</html>
