    // --- SYNTHESIZED AMBIENT AUDIO ENGINE (Web Audio API) ---
    // Memberikan preview suara dreamy musik alt-pop langsung di browser tanpa butuh hosting audio eksternal!
    class AmbientAudioEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.currentOscs = [];
        this.gainNode = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.gainNode = this.ctx.createGain();
          this.gainNode.gain.setValueAtTime(0.12, this.ctx.currentTime);
          this.gainNode.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTrack(track) {
        this.init();
        this.stop();

        const baseFreq = track.soundTone ? track.soundTone.root : 220;
        // Akor Dreamy Alt-Pop: Root, Minor 3rd/Major 3rd, 5th, Major 7th
        const chordMultipliers = [1, 1.1892, 1.4983, 1.8877];

        const now = this.ctx.currentTime;
        const subGain = this.ctx.createGain();
        subGain.gain.setValueAtTime(0.001, now);
        subGain.gain.exponentialRampToValueAtTime(0.08, now + 1.2);
        subGain.connect(this.gainNode);

        chordMultipliers.forEach((mult, index) => {
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();

          osc.type = index % 2 === 0 ? "sine" : "triangle";
          osc.frequency.setValueAtTime(baseFreq * mult, now);

          // Subtle chorus/detune for that nostalgic dreamy warmth
          osc.detune.setValueAtTime((index - 1.5) * 6, now);

          filter.type = "lowpass";
          filter.frequency.setValueAtTime(800 + (index * 200), now);

          osc.connect(filter);
          filter.connect(subGain);
          osc.start(now);
          this.currentOscs.push(osc);
        });

        this.currentSubGain = subGain;
        this.isPlaying = true;
      }

      stop() {
        if (this.ctx && this.currentOscs.length > 0) {
          const now = this.ctx.currentTime;
          if (this.currentSubGain) {
            this.currentSubGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
          }
          setTimeout(() => {
            this.currentOscs.forEach(o => {
              try { o.stop(); o.disconnect(); } catch (e) {}
            });
            this.currentOscs = [];
          }, 850);
        }
        this.isPlaying = false;
      }

      setVolume(vol) {
        if (this.gainNode && this.ctx) {
          this.gainNode.gain.setValueAtTime(vol * 0.18, this.ctx.currentTime);
        }
      }
    }

                  onClick={() => setSelectedLyrics(null)}
                  className="absolute top-5 right-5 p-2 rounded-full glass-card hover:bg-white/20 text-slate-400 hover:text-white transition-colors"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                <div className="flex items-center gap-4 mb-6">
                  <img src={selectedLyrics.cover} alt={selectedLyrics.title} className="w-16 h-16 rounded-xl object-cover border border-white/10" />
                  <div>
                    <span className="text-xs font-mono text-purple-400 uppercase tracking-widest">{selectedLyrics.year} Single</span>
                    <h3 className="font-serif italic font-bold text-3xl text-white">{selectedLyrics.title}</h3>
                  </div>
                </div>

                <div className="whitespace-pre-line font-serif text-slate-300 text-base leading-relaxed p-4 rounded-2xl bg-black/40 border border-white/5">
                  {selectedLyrics.fullLyrics}
                </div>

                <div className="mt-6 flex justify-between items-center text-xs">
                  <a
                    href={selectedLyrics.spotifyUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-emerald-400 hover:underline flex items-center gap-1"
                  >
                    <span>Dengarkan di Spotify</span>
                    <i data-lucide="external-link" className="w-3 h-3"></i>
                  </a>
                  <button
                    onClick={() => setSelectedLyrics(null)}
                    className="px-4 py-2 rounded-full bg-purple-600 hover:bg-purple-500 text-white font-medium transition-colors"
                  >
                    Tutup
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ================= LIGHTBOX IMAGE MODAL ================= */}
          {lightboxImage && (
            <div 
              onClick={() => setLightboxImage(null)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-lg cursor-pointer"
            >
              <div 
                onClick={(e) => e.stopPropagation()} 
                className="max-w-4xl w-full glass-panel rounded-3xl overflow-hidden border border-white/20 shadow-2xl"
              >
                <div className="relative max-h-[75vh] bg-black flex items-center justify-center">
                  <img src={lightboxImage.src} alt={lightboxImage.title} className="max-h-[75vh] w-auto object-contain" />
                  <button
                    onClick={() => setLightboxImage(null)}
                    className="absolute top-4 right-4 p-2.5 rounded-full bg-black/60 hover:bg-black/90 text-white transition-colors border border-white/10"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>
                <div className="p-6 bg-brand-dark flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                  <div>
                    <span className="text-xs font-mono text-purple-400 uppercase tracking-widest">{lightboxImage.tag}</span>
                    <h3 className="font-serif italic font-bold text-2xl text-white">{lightboxImage.title}</h3>
                    <p className="text-xs sm:text-sm text-slate-300 mt-1">{lightboxImage.desc}</p>
                  </div>
                  <a 
                    href={lightboxImage.src} 
                    download 
                    className="px-4 py-2 rounded-full glass-card hover:bg-white/10 text-xs font-mono text-slate-200 shrink-0 flex items-center gap-1.5"
                  >
                    <i data-lucide="download" className="w-3.5 h-3.5"></i>
                    <span>Simpan Foto</span>
                  </a>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React App
    ReactDOM.createRoot(document.getElementById('root')).render(<ParanoiseApp />);
  </script>
</body>
</html>
